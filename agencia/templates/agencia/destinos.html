
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Destinos - Agência de Viagens</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        header {
            background-color: #173b57;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .botao {
            display: inline-block;
            background-color: #173b57;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #e9eef2;
        }

        .editar {
            color: #173b57;
            font-weight: bold;
            text-decoration: none;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #173b57;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Destinos Turísticos</h1>
</header>

<div class="container">

    <a class="botao" href="{% url 'cadastrar_destino' %}">
        Cadastrar Destino
    </a>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>País</th>
                <th>Estado</th>
                <th>Descrição</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            {% for destino in destinos %}
            <tr>
                <td>{{ destino.nome }}</td>
                <td>{{ destino.pais }}</td>
                <td>{{ destino.estado }}</td>
                <td>{{ destino.descricao }}</td>
                <td>
                    <a class="editar" href="{% url 'editar_destino' destino.id %}">
    Editar
</a>

<a href="{% url 'excluir_destino' destino.id %}"
   style="color: red; font-weight: bold; text-decoration: none; margin-left: 10px;">
    Excluir
</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">Nenhum destino cadastrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <a class="voltar" href="/">Voltar ao início</a>

</div>

</body>
</html>
