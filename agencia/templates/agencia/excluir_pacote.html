
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Pacote</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f5f8;
        }

        header {
            background-color: #173b57;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 50%;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px #ccc;
        }

        .erro {
            color: red;
            font-weight: bold;
        }

        button {
            background-color: red;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancelar {
            display: inline-block;
            margin-left: 15px;
            color: #173b57;
        }
    </style>
</head>

<body>

<header>
    <h1>Excluir Pacote de Viagem</h1>
</header>

<div class="container">

    <h2>Deseja realmente excluir este pacote?</h2>

    <p><strong>{{ pacote.titulo }}</strong></p>

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% else %}
        <form method="POST">
            {% csrf_token %}
            <button type="submit">Sim, excluir</button>

            <a class="cancelar" href="{% url 'pacotes' %}">
                Cancelar
            </a>
        </form>
    {% endif %}

    {% if erro %}
        <a class="cancelar" href="{% url 'pacotes' %}">
            Voltar para pacotes
        </a>
    {% endif %}

</div>

</body>
</html>
