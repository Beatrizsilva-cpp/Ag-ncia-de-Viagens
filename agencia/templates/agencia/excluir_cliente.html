<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Cliente</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f6fa;
        }

        header {
            background-color: #123b5d;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            max-width: 550px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
        }

        h2 {
            color: #123b5d;
        }

        .excluir {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .cancelar {
            display: inline-block;
            background-color: #777;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Agência de Viagens</h1>
        <p>Exclusão de Clientes</p>
    </header>

    <main>
        <h2>Confirmar exclusão</h2>

        <p>Tem certeza de que deseja excluir o cliente:</p>

        <h3>{{ cliente.nome }}</h3>

        <p>Essa ação não poderá ser desfeita.</p>

        <form method="POST">
            {% csrf_token %}

            <button class="excluir" type="submit">
                Sim, excluir
            </button>

            <a class="cancelar" href="/clientes/">
                Cancelar
            </a>
        </form>
    </main>

</body>
</html>
